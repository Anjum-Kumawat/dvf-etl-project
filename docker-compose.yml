services:
  minio:
    image: minio/minio
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./data:/data
  postgres:
    image: postgres:16
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: dvf
      POSTGRES_PASSWORD: dvf
      POSTGRES_DB: dvf
    volumes:
      - postgres_data:/var/lib/postgresql/data
  dagster:
    build: ./orchestration/dagster
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - minio
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: dvf
      POSTGRES_USER: dvf
      POSTGRES_PASSWORD: dvf
    volumes:
      - ./:/opt/dvf-etl-project
  # RETL0-50: a separate daemon process, required for sensors (and
  # schedules) to actually be evaluated -- confirmed via the Dagster UI's
  # Deployment > Daemons page showing Sensors/Backfill/Scheduler all "Not
  # running" with the webserver-only setup above. Shares the same image,
  # env vars, and -- critically -- the same volume mount as the dagster
  # service, so both containers see the same DAGSTER_HOME (set inside the
  # mounted repo in the Dockerfile) and coordinate through the same
  # run/event storage rather than each having its own isolated state.
  dagster-daemon:
    build: ./orchestration/dagster
    command: ["sh", "-c", "mkdir -p $$DAGSTER_HOME && dagster-daemon run -m orchestration.dagster.dvf_dagster.definitions"]
    depends_on:
      - postgres
      - minio
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: dvf
      POSTGRES_USER: dvf
      POSTGRES_PASSWORD: dvf
    volumes:
      - ./:/opt/dvf-etl-project
  metabase:
    image: metabase/metabase
    ports:
      - "3001:3000"
    depends_on:
      - postgres
volumes:
  postgres_data:
# NOTE: this is a starting skeleton for Sprint 0.
# P1 (ingestion/infra) owns filling in the Dagster build context,
# env vars, and any additional services (e.g. a model-serving container in Sprint 6).