services:
  minio:
    image: quay.io/minio/minio
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./data:/data
  # RETL0-54: found via a real fresh-clone test that nothing ever created
  # the "bronze" MinIO bucket -- it existed in dev only because someone
  # created it manually early in the project. A truly fresh clone hit
  # NoSuchBucket on every upload (dvf_bronze, ban_bronze, geo_bronze,
  # filosofi_bronze all failed this way). This is the standard MinIO +
  # Docker Compose fix: a one-shot mc container that creates the bucket
  # (idempotently -- --ignore-existing) if it doesn't already exist, then
  # exits. dagster/dagster-daemon wait for it to actually finish, not just
  # start (service_completed_successfully), since it's one-shot.
  #
  # Both minio and mc images point at quay.io, not Docker Hub: MinIO
  # stopped publishing container images to Docker Hub in October 2025 and
  # the minio/minio and minio/mc repos were delisted there entirely
  # (confirmed by a real pull failure: "repository does not exist" for
  # minio/mc, mid-RETL0-54). Our minio: service had been working this
  # whole project only because the image was already cached locally from
  # early setup -- on a genuinely fresh machine with no cache it would
  # fail the same way. quay.io/minio/... is MinIO's own registry and still
  # serves these images.
  createbuckets:
    image: quay.io/minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/bronze;
      exit 0;
      "
  postgres:
    image: postgres:16
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: dvf
      POSTGRES_PASSWORD: dvf
      POSTGRES_DB: dvf
    volumes:
      - postgres_data:/var/lib/postgresql/data
  dagster:
    build: ./orchestration/dagster
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_started
      minio:
        condition: service_started
      createbuckets:
        condition: service_completed_successfully
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: dvf
      POSTGRES_USER: dvf
      POSTGRES_PASSWORD: dvf
    volumes:
      - ./:/opt/dvf-etl-project
  # RETL0-50: a separate daemon process, required for sensors (and
  # schedules) to actually be evaluated -- confirmed via the Dagster UI's
  # Deployment > Daemons page showing Sensors/Backfill/Scheduler all "Not
  # running" with the webserver-only setup above. Shares the same image,
  # env vars, and -- critically -- the same volume mount as the dagster
  # service, so both containers see the same DAGSTER_HOME (set inside the
  # mounted repo in the Dockerfile) and coordinate through the same
  # run/event storage rather than each having its own isolated state.
  dagster-daemon:
    build: ./orchestration/dagster
    command: ["sh", "-c", "mkdir -p $$DAGSTER_HOME && dagster-daemon run -m orchestration.dagster.dvf_dagster.definitions"]
    depends_on:
      postgres:
        condition: service_started
      minio:
        condition: service_started
      createbuckets:
        condition: service_completed_successfully
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: dvf
      POSTGRES_USER: dvf
      POSTGRES_PASSWORD: dvf
    volumes:
      - ./:/opt/dvf-etl-project
  metabase:
    image: metabase/metabase
    ports:
      - "3001:3000"
    depends_on:
      - postgres
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase_data:/metabase-data
volumes:
  postgres_data:
  metabase_data:
# NOTE: this is a starting skeleton for Sprint 0.
# P1 (ingestion/infra) owns filling in the Dagster build context,
# env vars, and any additional services (e.g. a model-serving container in Sprint 6).
