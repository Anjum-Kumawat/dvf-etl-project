services:
  minio:
    image: minio/minio
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./data:/data
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: dvf
      POSTGRES_PASSWORD: dvf
      POSTGRES_DB: dvf
    volumes:
      - postgres_data:/var/lib/postgresql/data
  # dagster:
  #   build: ./orchestration/dagster
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - postgres
  #     - minio
  #   environment:
  #     DAGSTER_POSTGRES_HOST: postgres
  #     DAGSTER_POSTGRES_USER: dvf
  #     DAGSTER_POSTGRES_PASSWORD: dvf
  #     DAGSTER_POSTGRES_DB: dvf
  # TODO(sprint-6): re-enable once orchestration/dagster/Dockerfile exists
  metabase:
    image: metabase/metabase
    ports:
      - "3001:3000"
    depends_on:
      - postgres
volumes:
  postgres_data:
