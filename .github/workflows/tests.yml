name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # PySpark (used by the Silver/Gold test suite) needs a JVM. Matches
      # the JDK version installed in orchestration/dagster/Dockerfile so
      # CI and the real pipeline run against the same Java version.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: orchestration/dagster/requirements-dagster.txt

      # Neither requirements file alone is enough: requirements.txt has
      # pytest but not pyspark, requirements-dagster.txt (under
      # orchestration/dagster/, per the Dockerfile's build context -- not
      # the repo root) has pyspark but not pytest (confirmed via a real
      # CI failure: "No module named pytest" after installing only the
      # dagster requirements). The Silver/Gold tests need pyspark: install
      # both files.
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r orchestration/dagster/requirements-dagster.txt

      # No live MinIO/Postgres needed: the suite is isolated with
      # tmp_path/monkeypatch fixtures and a fake S3 client
      # (tests/ingestion/fake_s3.py), per README's Testing section.
      - name: Run test suite
        run: python -m pytest tests/ -v