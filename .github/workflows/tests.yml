name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # PySpark (used by the Silver/Gold test suite) needs a JVM. Matches
      # the JDK version installed in orchestration/dagster/Dockerfile so
      # CI and the real pipeline run against the same Java version.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: orchestration/dagster/requirements-dagster.txt

      # requirements.txt alone (requests/boto3/pytest) isn't enough to run
      # the Silver/Gold tests -- they exercise real PySpark transforms.
      # requirements-dagster.txt (under orchestration/dagster/, per the
      # Dockerfile's build context -- not the repo root) is what actually
      # has pyspark, and matches what the Dagster image installs, so CI
      # validates against the same dependency set the real pipeline runs
      # on.
      - name: Install dependencies
        run: pip install -r orchestration/dagster/requirements-dagster.txt

      # No live MinIO/Postgres needed: the suite is isolated with
      # tmp_path/monkeypatch fixtures and a fake S3 client
      # (tests/ingestion/fake_s3.py), per README's Testing section.
      - name: Run test suite
        run: python -m pytest tests/ -v